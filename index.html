<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>New LMS 교안 준비기</title>
<style>
  /* Soft-gold token set, hand-rolled (no build step, no dependency). */
  :root {
    --bg: #faf7ef; --card: #fffdf7; --fg: #3b3422; --muted: #6f6550;
    --border: #e6dcc0; --accent: #f5efdc;
    --primary: #8a6d1a; --primary-hover: #74590f; --primary-fg: #fffdf7;
    --gold: #b8912c; --ring: rgba(138, 109, 26, .22);
    --fail: #b91c1c; --fail-bg: #fdecec; --fail-bd: #f5c6c2;
    --warn: #c2410c; --warn-bg: #fff3e8; --warn-bd: #fbd3ae;
    --info: #1d4ed8; --info-bg: #eef4ff; --info-bd: #c5d8fc;
    --ok: #15803d;   --ok-bg: #effaf2;   --ok-bd: #b9e7c5;
    --r: 12px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.6 -apple-system, "Segoe UI", "Malgun Gothic", system-ui, sans-serif; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 36px 24px 60px; }
  header { margin-bottom: 24px; }
  h1 { font-size: 20px; font-weight: 700; letter-spacing: -.01em; margin: 0 0 6px; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
          box-shadow: 0 1px 2px rgba(59, 52, 34, .06); margin-bottom: 14px; }
  .card-h { padding: 16px 20px 0; }
  .card-t { font-size: 14px; font-weight: 600; }
  .card-d { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
  .card-c { padding: 14px 20px 16px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 12.5px; }
  .hide { display: none; }
  code { background: var(--accent); border-radius: 5px; padding: 1px 5px; font-size: 12px;
         font-family: ui-monospace, Menlo, Consolas, monospace; }
  select { font: inherit; height: 32px; padding: 0 8px; border: 1px solid var(--border);
           border-radius: 8px; background: #fff; color: inherit; }
  select:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--ring); }

  .btn { font: inherit; font-size: 13px; font-weight: 500; height: 36px; padding: 0 14px;
         border: 1px solid var(--border); border-radius: 8px; background: var(--card);
         color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
         transition: background .15s, border-color .15s; }
  .btn:hover { background: var(--accent); border-color: var(--gold); }
  .btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-fg); }
  .btn.primary:hover { background: var(--primary-hover); }

  #drop { border: 2px dashed var(--border); border-radius: var(--r); padding: 36px;
          text-align: center; color: var(--muted); cursor: pointer; font-size: 13.5px;
          transition: .15s; }
  #drop:hover, #drop.over { border-color: var(--gold); color: var(--fg); background: var(--accent); }
  .chip { background: #f3ecd2; border: 1px solid #decf9c; border-radius: 8px; color: #6b5410;
          padding: 4px 10px; font-size: 12.5px; font-weight: 600; }

  .badge { display: inline-flex; align-items: center; border-radius: 999px; padding: 2px 10px;
           font-size: 11.5px; font-weight: 600; border: 1px solid; white-space: nowrap; }
  .badge.fail { color: var(--fail); background: var(--fail-bg); border-color: var(--fail-bd); }
  .badge.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-bd); }
  .badge.info { color: var(--info); background: var(--info-bg); border-color: var(--info-bd); }
  .badge.ok   { color: var(--ok);   background: var(--ok-bg);   border-color: var(--ok-bd); }
  .badge.zero { opacity: .4; }

  details.acc { background: var(--card); border: 1px solid var(--border); border-radius: var(--r);
                box-shadow: 0 1px 2px rgba(59, 52, 34, .06); margin-bottom: 14px; }
  .acc summary { list-style: none; cursor: pointer; display: flex; align-items: center;
                 gap: 12px; padding: 13px 20px; user-select: none; }
  .acc summary::-webkit-details-marker { display: none; }
  .acc .chev { margin-left: auto; color: var(--muted); transition: transform .2s; flex: 0 0 auto; }
  details[open] .chev { transform: rotate(180deg); }
  .acc-body { border-top: 1px solid var(--border); padding: 6px 20px 14px; }
  .chg { list-style: none; margin: 4px 0 0; padding: 0; }
  .chg li { padding: 6px 0; border-top: 1px solid var(--border); font-size: 12.5px; }
  .chg li:first-child { border-top: none; }
  .f { display: flex; gap: 10px; padding: 7px 0; border-top: 1px solid var(--border);
       font-size: 12.5px; align-items: baseline; }
  .f:first-child { border-top: none; }
  .f .badge { flex: 0 0 54px; justify-content: center; }
  .f .ref { flex: 0 0 76px; color: var(--muted);
            font: 11.5px ui-monospace, Menlo, Consolas, monospace; }
  .f .where { flex: 0 0 62px; color: var(--muted); }
  .okline { color: var(--ok); font-size: 13px; padding: 8px 0 2px; }

  /* Access gate -- active only when served from the public URL */
  #gate { display: none; }
  body.gated .wrap { display: none; }
  body.gated #gate { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
</style>
</head>
<body>
<div id="gate">
  <div class="card" style="max-width: 380px; width: 100%;">
    <div class="card-h"><div class="card-t">New LMS 교안 준비기</div>
      <div class="card-d">모두의연구소 구성원만. 회사 Google 계정으로 로그인.</div></div>
    <div class="card-c">
      <div id="gsiBtn"></div>
      <p class="muted" id="gateMsg" style="margin: 10px 0 0;"></p>
    </div>
  </div>
</div>

<div class="wrap">
<header>
  <h1>New LMS 교안 준비기</h1>
  <p>ipynb → 업로드 규격 자동 변환. 파일은 브라우저 밖으로 안 나감</p>
</header>

<section class="card">
  <div class="card-c">
    <div id="drop">.ipynb 끌어다 놓기 / 클릭해서 선택
      <input type="file" id="file" accept=".ipynb,application/json" class="hide"></div>
    <div id="loadedRow" class="row hide" style="justify-content: space-between;">
      <div class="row" style="gap: 8px;">
        <span class="chip" id="fileName"></span>
        <span class="muted" id="before"></span>
      </div>
      <button class="btn" id="reset">다른 파일</button>
    </div>
  </div>
</section>

<section class="card hide gated-el" id="resultCard">
  <div class="card-h"><div class="card-t">변환 결과</div></div>
  <div class="card-c">
    <div class="row">
      <span class="muted">레벨</span><select id="level"></select>
      <span class="muted" id="plan"></span>
    </div>
    <div class="row" style="margin-top: 12px;">
      <button class="btn primary" id="dl">변환본 다운로드</button>
      <span class="muted" id="outName"></span>
    </div>
  </div>
</section>

<details class="acc hide gated-el" id="changes" open>
  <summary><span class="card-t">변경 내역</span>
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6"/></svg>
  </summary>
  <div class="acc-body"><ul class="chg" id="changeList"></ul></div>
</details>

<details class="acc hide gated-el" id="status">
  <summary><span class="card-t">검사 결과</span>
    <span class="row" id="sumBadges" style="gap: 6px;"></span>
    <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="m6 9 6 6 6-6"/></svg>
  </summary>
  <div class="acc-body">
    <p class="muted" style="margin: 10px 0 6px;">FAIL: 업로드 깨짐 · WARN: 가이드 권장 · INFO: 참고</p>
    <div id="findings"></div>
  </div>
</details>
</div>

<script>
(function () {
  'use strict';
  // Access gate: Google sign-in, @modulabs.co.kr only. file:// and localhost skip it.
  var CLIENT_ID = '1008534946447-80gu1s0poi8hrp8e4n1i5s95oqq9infn.apps.googleusercontent.com';
  var local = location.protocol === 'file:' ||
    /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
  if (local) return;
  document.body.classList.add('gated');
  var msg = document.getElementById('gateMsg');
  function onCred(resp) {
    try {
      var b = resp.credential.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      var payload = JSON.parse(atob(b + '==='.slice((b.length + 3) % 4)));
      if (payload.hd === 'modulabs.co.kr') {
        document.body.classList.remove('gated');
        return;
      }
    } catch (e) { /* fall through */ }
    msg.textContent = '모두의연구소 계정(@modulabs.co.kr)으로 로그인해 주세요.';
  }
  var s = document.createElement('script');
  s.src = 'https://accounts.google.com/gsi/client';
  s.onload = function () {
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCred, auto_select: true });
    google.accounts.id.renderButton(document.getElementById('gsiBtn'),
      { type: 'standard', text: 'signin_with', width: 280 });
    google.accounts.id.prompt();
  };
  s.onerror = function () { msg.textContent = '로그인 모듈 로드 실패. 새로고침 해주세요.'; };
  document.head.appendChild(s);
})();
</script>
<script src="prep.js"></script>
<script>
(function () {
  'use strict';
  var N = window.NewLMS;
  if (!N) {
    document.body.innerHTML = '<p style="padding:40px;font:15px sans-serif">prep.js 로드 실패. ' +
      'index.html 과 같은 폴더에 있어야 함.</p>';
    return;
  }
  var S = { nb: null, name: '', fileVer: '', sections: [], autoCreated: false };
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls) { var e = document.createElement(tag); if (cls) e.className = cls; return e; }

  N.LEVELS.forEach(function (l) {
    var o = el('option'); o.value = o.textContent = l; $('level').appendChild(o);
  });

  function setReady(yes) {
    $('drop').classList.toggle('hide', yes);
    $('loadedRow').classList.toggle('hide', !yes);
    ['resultCard', 'changes', 'status'].forEach(function (id) {
      $(id).classList.toggle('hide', !yes);
    });
    if (!yes) $('status').open = false;
  }

  function load(file) {
    var r = new FileReader();
    r.onload = function () {
      var nb;
      try { nb = JSON.parse(r.result); }
      catch (e) { alert('JSON 파싱 실패. ipynb 파일인지 확인. (' + e.message + ')'); return; }
      if (!nb || !Array.isArray(nb.cells)) { alert('cells 없음. ipynb 파일인지 확인.'); return; }
      S.nb = nb; S.name = file.name;
      S.fileVer = (nb.metadata && nb.metadata.language_info &&
                   nb.metadata.language_info.version) || '';
      $('level').value = N.readLevel(nb) || '입문';
      // Titles get an ordinal + period prefix (the admin's str(Step) splits on
      // the period); everything else about the title is left alone.
      S.autoCreated = false;
      S.sections = N.readSections(nb).map(function (s, i) {
        return { origin: 'existing', cell: s.cell, orig: s.title,
                 title: N.proposeTitle('', i + 1, s.title),
                 minutes: s.minutes || '15', type: s.type || 'practice' };
      });
      if (!S.sections.length) {
        S.sections = [{ origin: 'new', at: 0, title: '1. 들어가며', minutes: '15', type: 'practice' }];
        S.autoCreated = true;
      }
      var n = { FAIL: 0, WARN: 0, INFO: 0 };
      N.findings(nb).forEach(function (x) { n[x.sev] += 1; });
      $('before').textContent = '원본: FAIL ' + n.FAIL + ' · WARN ' + n.WARN + ' · INFO ' + n.INFO;
      $('fileName').textContent = file.name;
      setReady(true);
      refresh();
    };
    r.readAsText(file);
  }

  $('file').addEventListener('change', function (e) { if (e.target.files[0]) load(e.target.files[0]); });
  $('drop').addEventListener('click', function () { $('file').click(); });
  ['dragenter', 'dragover'].forEach(function (ev) {
    $('drop').addEventListener(ev, function (e) { e.preventDefault(); $('drop').classList.add('over'); });
  });
  ['dragleave', 'drop'].forEach(function (ev) {
    $('drop').addEventListener(ev, function (e) { e.preventDefault(); $('drop').classList.remove('over'); });
  });
  $('drop').addEventListener('drop', function (e) {
    if (e.dataTransfer.files[0]) load(e.dataTransfer.files[0]);
  });

  function answers() {
    return {
      code: '',
      level: $('level').value,
      langVersion: '3.8',
      sections: S.sections.slice().sort(function (a, b) {
        return (a.origin === 'new' ? a.at : a.cell) - (b.origin === 'new' ? b.at : b.cell);
      }),
      fillCodeExtra: true,
      stripOutputs: true,
      dropStepId: true
    };
  }

  function drawBadges(host, c) {
    host.innerHTML = '';
    if (!c.FAIL && !c.WARN && !c.INFO) {
      var b = el('span', 'badge ok'); b.textContent = '통과';
      host.appendChild(b); return;
    }
    [['FAIL', 'fail'], ['WARN', 'warn'], ['INFO', 'info']].forEach(function (p) {
      var b = el('span', 'badge ' + p[1] + (c[p[0]] ? '' : ' zero'));
      b.textContent = p[0] + ' ' + c[p[0]];
      host.appendChild(b);
    });
  }

  function refresh() {
    var a = answers();
    var out = N.convert(S.nb, a);
    var fs = N.findings(out);
    var c = { FAIL: 0, WARN: 0, INFO: 0 };
    fs.forEach(function (x) { c[x.sev] += 1; });
    drawBadges($('sumBadges'), c);

    var host = $('findings'); host.innerHTML = '';
    if (!fs.length) {
      var ok = el('div', 'okline'); ok.textContent = '걸리는 항목 없음'; host.appendChild(ok);
    }
    fs.forEach(function (x) {
      var d = el('div', 'f');
      var b = el('span', 'badge ' + x.sev.toLowerCase()); b.textContent = x.sev; d.appendChild(b);
      var ref = el('span', 'ref'); ref.textContent = x.ref; d.appendChild(ref);
      var wh = el('span', 'where'); wh.textContent = x.where; d.appendChild(wh);
      var m = el('span'); m.textContent = x.msg; d.appendChild(m);
      host.appendChild(d);
    });

    var p = N.plan(S.nb, a);
    $('plan').textContent = '섹션 ' + p.sections + ' · 제목 고침 ' + p.retitled +
      ' · 출력 비움 ' + p.outputsCleared + ' · _extra 채움 ' + p.codeExtraFilled +
      ' · step_id 제거 ' + p.stepIdsDropped;
    $('outName').textContent = N.outputName(S.name, '') + '.ipynb';

    var list = $('changeList'); list.innerHTML = '';
    function li(text, codes) {
      var e = el('li');
      if (codes) { e.innerHTML = text; } else { e.textContent = text; }
      list.appendChild(e);
    }
    if (S.autoCreated) li('섹션 자동 생성: "1. 들어가며" (원본에 섹션 없음)');
    S.sections.forEach(function (s) {
      if (s.origin === 'existing' && s.orig !== s.title) {
        li('섹션 제목: "' + s.orig + '" → "' + s.title + '"');
      }
    });
    if (p.outputsCleared) li('실행 결과·execution_count 비움: ' + p.outputsCleared + '개 셀');
    if (p.codeExtraFilled) li('코드 셀 _extra 채움: ' + p.codeExtraFilled + '개');
    if (p.stepIdsDropped) li('step_id 제거: ' + p.stepIdsDropped + '개');
    li('레벨 「' + a.level + '」 도장: ' + (p.levelStamped + p.codeExtraFilled) + '개 셀');
    if (S.fileVer !== '3.8') li('language_info.version: ' + (S.fileVer || '없음') + ' → 3.8');
    li('kernelspec 고정: python3 · section_id 재정렬: sec_1 ~ sec_' + p.sections);
  }

  $('level').addEventListener('change', refresh);

  function download(name, text) {
    var b = new Blob([text], { type: 'application/octet-stream' });
    var u = URL.createObjectURL(b);
    var a = el('a'); a.href = u; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(u); }, 1000);
  }
  $('dl').addEventListener('click', function () {
    var a = answers();
    download(N.outputName(S.name, '') + '.ipynb',
             JSON.stringify(N.convert(S.nb, a), null, 1));
  });
  $('reset').addEventListener('click', function () {
    S = { nb: null, name: '', fileVer: '', sections: [], autoCreated: false };
    $('file').value = '';
    setReady(false);
  });
})();
</script>
</body>
</html>
